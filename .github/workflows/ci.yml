name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=moderate
      - run: npx eslint . --max-warnings=0
      - run: npx tsc --noEmit

  test:
    name: Unit Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run test:coverage
      - run: npm run prisma:validate
      - run: npm run docs:validate

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    env:
      DATABASE_URL: "postgresql://fake:fake@localhost:5432/fake"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "ci-test-secret-not-real-012345678901234567890123456789"
      CLOUDINARY_CLOUD_NAME: "ci-cloud"
      CLOUDINARY_API_KEY: "ci-key"
      CLOUDINARY_API_SECRET: "ci-secret"
      EMAIL_PROVIDER: "log"
      CRON_SECRET: "ci-cron-secret"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npx next build

  load-smoke:
    name: Load Smoke (não bloqueante)
    runs-on: ubuntu-latest
    needs: [lint-typecheck, test]
    # Não bloqueia o merge: serve para acompanhar a tendência de latência, e um
    # pico isolado não deve travar o pipeline.
    continue-on-error: true
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: load
          POSTGRES_PASSWORD: load
          POSTGRES_DB: cheerconnect_load
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U load -d cheerconnect_load"
          --health-interval 2s --health-timeout 3s --health-retries 30

    env:
      DATABASE_URL: "postgresql://load:load@localhost:5432/cheerconnect_load"
      # Tem que ser https: com NODE_ENV=production e NEXTAUTH_URL http, o
      # auth.ts grava o cookie com prefixo __Secure- enquanto o getToken do
      # proxy procura o nome sem prefixo, e toda rota autenticada devolve 401.
      NEXTAUTH_URL: "https://localhost:3000"
      NEXTAUTH_SECRET: "ci-load-secret-not-real-012345678901234567890"
      CLOUDINARY_CLOUD_NAME: "ci-load"
      CLOUDINARY_API_KEY: "ci-load"
      CLOUDINARY_API_SECRET: "ci-load"
      EMAIL_PROVIDER: "log"
      CRON_SECRET: "ci-load-cron"
      LOAD_USERS: "30"

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build

      - name: Semeia a base de carga
        run: node scripts/load-seed.mjs

      - name: Sobe a aplicação
        run: |
          node scripts/start-standalone.mjs &
          for i in $(seq 1 60); do
            if curl -sf http://localhost:3000/api/health > /dev/null; then
              echo "app pronto"; break
            fi
            sleep 2
          done
          curl -sf http://localhost:3000/api/health || { echo "app não subiu"; exit 1; }

      - name: Instala o k6
        uses: grafana/setup-k6-action@v1.2.2

      - name: Carga de leitura
        run: |
          k6 run \
            -e LOAD_BASE_URL=http://localhost:3000 \
            -e LOAD_DURATION=45s \
            -e LOAD_AUTH_USERS=8 \
            -e LOAD_READ_ONLY=true \
            -e LOAD_PASSWORD=123456 \
            -e LOAD_USERS=30 \
            --quiet --no-color \
            tests/load/main.js
